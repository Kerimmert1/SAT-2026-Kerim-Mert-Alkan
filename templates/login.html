{% extends 'base.html' %}

{% block content %}
<div style="max-width:480px; margin:80px auto;">
  <div class="panel">
    <h2 style="margin-top:0;">Yönetici Girişi</h2>
    <p class="small">Sistem sadeleştirilmiş öğrenci devamsızlık takip modülüne hoş geldiniz.</p>

    <form method="post">
      <div>
        <label for="username">Kullanıcı Adı</label>
        <input id="username" name="username" placeholder="admin" required>
      </div>

      <div>
        <label for="password">Şifre</label>
        <input id="password" type="password" name="password" placeholder="admin123" required>
      </div>

      <button class="btn btn-primary" type="submit">Giriş Yap</button>
    </form>

    <p class="small" style="margin-top:12px;">Varsayılan giriş: admin / admin123</p>
  </div>
</div>
{% endblock %}
